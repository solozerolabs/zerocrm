[project]
name = "zerocrm"
version = "0.1.0"
description = "Agent-native CRM + outreach engine for zero-hour companies. No UI, no data entry, one daily digest."
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "sqlalchemy>=2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
# only needed to run against Postgres; the SQLite default needs nothing extra
postgres = ["psycopg[binary]>=3.1"]

[project.scripts]
zerocrm = "zerocrm.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["zerocrm"]
